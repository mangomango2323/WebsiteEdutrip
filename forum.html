<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JEJAK ILMU DI NEGERI LASKAR PELANGI</title>

    <link href="https://fonts.googleapis.com/css2?family=Arsenal:wght@400;700&family=Poppins:wght@300;600&display=swap" rel="stylesheet">

    <style>
        * { margin:0; padding:0; box-sizing:border-box; }

        body {
            font-family:'Poppins', sans-serif;
            color:white;
        }

        body::before {
            content:"";
            position:fixed;
            inset:0;
            background:url('background.png') no-repeat center/cover;
            z-index:-2;
        }
        body::after {
            content:"";
            position:fixed;
            inset:0;
            background:rgba(0,0,0,0.5);
            z-index:-1;
        }

        .navbar {
            position: fixed;
            top: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 40px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            z-index: 1000;
        }

        .nav-links {
            display: flex;
            gap: 70px; 
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-weight: 600;
            letter-spacing: 3px;
            font-size: 14px;
        }

        .nav-links a:hover {
            color: gold;
        }

        .nav-links a.active {
            color: gold;
        }

        .nav-logo {
            position: absolute;
            right: 40px;
        }

        .nav-logo img {
            width: 50px;
        }

        .header {
            padding-top:140px;
            text-align:center;
            padding-bottom:30px;
        }

        .header h1 {
            font-family:'Arsenal';
            font-size:40px;
        }

        .box {
            width:700px;
            margin:0 auto 40px auto;
            background:rgba(80,60,40,0.9);
            padding:40px 50px;
            border-radius:12px;
            text-align:center;
        }

        form {
            width:600px;
            margin:0 auto;
            text-align:left;
        }

        label {
            display:block;
            margin-top:10px;
            margin-bottom:5px;
        }

        input, textarea {
            width:100%;
            padding:12px;
            border:none;
            border-radius:6px;
            margin-bottom:12px;
        }

        textarea { height:220px; }

        .radio-group {
            display:flex;
            gap:40px;
            margin-bottom:12px;
        }

        .radio-group label {
            display:flex;
            align-items:center;
            gap:10px;
            cursor:pointer;
            font-size:14px;
        }

        .radio-group input[type="radio"] {
            width:auto;
            margin:0;
        }

        button {
            padding:10px 20px;
            border:none;
            border-radius:6px;
            cursor:pointer;
        }

        button:hover {
            background:gold;
            color:black;
        }

        #output {
            margin-top:20px;
            text-align:left;
        }

        #output p {
            background: rgba(255,255,255,0.1);
            padding: 10px;
            border-radius: 6px;
            margin-top: 10px;
        }

        .footer {
            background: rgba(40,30,20,0.95);
            padding: 30px 20px;
        }

        .footer-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: auto;
            text-align: center;
        }

        .footer-left,
        .footer-right {
            width: 30%;
            font-weight: 600;
        }

        .footer-center {
            width: 40%;
        }

        .footer-center p {
            margin: 3px 0;
            font-size: 14px;
        }

        .footer-left p,
        .footer-right p {
            font-size: 14px;
        }

    </style>
</head>

<body>
    <div class="navbar">
        <div class="nav-links">
            <a href="index.html">HOME</a>
            <a href="aktivitas.html">AKTIVITAS</a>
            <a href="galeri.html">GALERI</a>
            <a href="destinasi.html">DESTINASI</a>
            <a href="forum.html" class="active">FORUM</a>
        </div>
        <div class="nav-logo">
            <img src="logo.png">
        </div>
    </div>

    <div class="header">
        <h1>RUANG BERBAGI DAN MAKNA PERJALANAN</h1>
    </div>

    <div class="box">
        <h2>FORUM BERBAGI</h2>

        <form>
            <label>Nama:</label>
            <input type="text" id="nama">

            <label>Email: (opsional)</label>
            <input type="email">

            <label>Jenis Kelamin: (opsional)</label>
            <div class="radio-group">
                <label><input type="radio" name="jk"> Pria</label>
                <label><input type="radio" name="jk"> Perempuan</label>
            </div>

            <label>Masukan:</label>
            <textarea id="masukan"></textarea>

            <button type="button" onclick="kirimData()">Kirim</button>
            <button type="reset">Hapus</button>
        </form>

        <div id="output"></div>

    </div>

    <div class="footer">
        <div class="footer-container">
            
            <div class="footer-left">
                <p>VINCENTIUS YOEL PRAMONO_11.2</p>
            </div>

            <div class="footer-center">
                <p><strong>DIBUAT OLEH:</strong></p>
                <p>SMA SANTA LAURENSIA ALAM SUTERA</p>
                <p>TANGERANG, BANTEN</p>
                <p>2026</p>
            </div>

            <div class="footer-right">
                <p>MICHELLE ADELINE BUSTAMIN_11.2</p>
            </div>
        </div>
    </div>

    <script>
    function kirimData() {
        let nama = document.getElementById("nama").value;
        let masukan = document.getElementById("masukan").value;

        if(nama === "" || masukan === "") {
            alert("Lengkapi forum terlebih dahulu!");
            return;
        }

        let output = document.getElementById("output");

        let baru = document.createElement("p");
        baru.innerHTML = "<strong>" + nama + "</strong><br>" + masukan;

        output.appendChild(baru);
    }
    </script>

</body>
</html>
